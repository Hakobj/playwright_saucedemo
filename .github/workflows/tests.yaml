name: Build and Test Swaglabs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-tests .

      - name: Run tests in container
        # run: docker run --rm -v ${{ github.workspace }}/reports:/app/reports playwright-tests
        run: docker compose up --build --exit-code-from playwright-tests
        working-directory: docker-compose-demo

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/