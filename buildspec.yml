version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt
      - playwright install chromium
  build:
    commands:
      - pytest tests/ --junitxml=reports/results.xml
  post_build:
    commands:
      - echo "QA tests completed"
reports:
  qa-test-reports:
    files:
      - "reports/**/*"
    file-format: JUNITXML
artifacts:
  files:
    - "reports/**/*"
  base-directory: .
